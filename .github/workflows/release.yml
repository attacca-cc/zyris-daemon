name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 22.04, not 24.04, and the version is the whole point. A glibc-linked binary runs on the
  # glibc it was built against or newer, never older, so the build host sets the oldest system
  # the release can be installed on. 24.04 ships glibc 2.39; v0.1.0 and v0.2.0 were built there
  # and would not load on Debian 12 (2.36) at all — `version GLIBC_2.38 not found`, before main.
  # 22.04 ships 2.35, which covers Debian 12 and Ubuntu 22.04 upward. Raising this runner
  # silently narrows who can install; the glibc floor check below is what makes that loud.
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: display build deps (keep going on failure — display is optional)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libgbm-dev libwayland-dev \
            libxkbcommon-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libei-dev libspa-0.2-dev libpipewire-0.3-dev pkg-config || echo "apt warning — the release goes on without display"

      - name: build (workspace + display)
        run: |
          set -e
          bash scripts/ci-unpatch-display.sh
          cargo build --release --workspace
          if cargo build --release --manifest-path display/Cargo.toml; then
            echo "DISPLAY_OK=1" >> "$GITHUB_ENV"
          else
            echo "DISPLAY_OK=0" >> "$GITHUB_ENV"
            echo "::warning::zyrisd-display build failed — shipping without display"
          fi

      # Before packaging, not after: a binary that cannot start on the oldest system we claim to
      # support is not a release asset, and the runner is the only place that fact is visible.
      # The floor comes from the .deb's own `depends = "libc6 (>= …)"`, so the package and the
      # binary inside it cannot disagree about who can install this.
      - name: glibc floor
        run: |
          set -e
          bash scripts/check-glibc-floor.sh target/release/zyrisd
          if [ "$DISPLAY_OK" = "1" ]; then
            bash scripts/check-glibc-floor.sh display/target/release/zyrisd-display
          fi

      - name: install cargo-deb
        run: cargo install cargo-deb --locked

      - name: package (tarball + deb)
        run: |
          set -e
          mkdir -p dist
          if [ "$DISPLAY_OK" = "1" ]; then
            tar czf dist/zyrisd-x86_64-linux.tar.gz -C target/release zyrisd -C display/target/release zyrisd-display
          else
            tar czf dist/zyrisd-x86_64-linux.tar.gz -C target/release zyrisd
          fi
          if [ "$DISPLAY_OK" != "1" ]; then
            sed -i '/zyrisd-display/d' crates/zyrisd/Cargo.toml
          fi
          cargo deb --no-build -p zyrisd
          cp target/debian/*.deb dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  # Same glibc floor as x86_64 — see the note on that job.
  linux-aarch64:
    name: Linux aarch64
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: display build deps (keep going on failure — display is optional)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1-mesa-dev libgbm-dev libwayland-dev \
            libxkbcommon-dev libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libei-dev libspa-0.2-dev libpipewire-0.3-dev pkg-config || echo "apt warning — the release goes on without display"

      - name: build (workspace + display)
        run: |
          set -e
          bash scripts/ci-unpatch-display.sh
          cargo build --release --workspace
          if cargo build --release --manifest-path display/Cargo.toml; then
            echo "DISPLAY_OK=1" >> "$GITHUB_ENV"
          else
            echo "DISPLAY_OK=0" >> "$GITHUB_ENV"
            echo "::warning::zyrisd-display build failed — shipping without display"
          fi

      # Before packaging, not after: a binary that cannot start on the oldest system we claim to
      # support is not a release asset, and the runner is the only place that fact is visible.
      # The floor comes from the .deb's own `depends = "libc6 (>= …)"`, so the package and the
      # binary inside it cannot disagree about who can install this.
      - name: glibc floor
        run: |
          set -e
          bash scripts/check-glibc-floor.sh target/release/zyrisd
          if [ "$DISPLAY_OK" = "1" ]; then
            bash scripts/check-glibc-floor.sh display/target/release/zyrisd-display
          fi

      - name: install cargo-deb
        run: cargo install cargo-deb --locked

      - name: package (tarball + deb)
        run: |
          set -e
          mkdir -p dist
          if [ "$DISPLAY_OK" = "1" ]; then
            tar czf dist/zyrisd-aarch64-linux.tar.gz -C target/release zyrisd -C display/target/release zyrisd-display
          else
            tar czf dist/zyrisd-aarch64-linux.tar.gz -C target/release zyrisd
          fi
          if [ "$DISPLAY_OK" != "1" ]; then
            sed -i '/zyrisd-display/d' crates/zyrisd/Cargo.toml
          fi
          cargo deb --no-build -p zyrisd
          cp target/debian/*.deb dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: build (workspace)
        run: cargo build --release --workspace

      - name: smoke test
        run: .\target\release\zyrisd.exe --version

      - name: package (zip + NSIS installer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\zyrisd.exe -DestinationPath dist\zyrisd-x86_64-windows.zip
          Copy-Item target\release\zyrisd.exe packaging\windows\zyrisd.exe -Force
          choco install nsis -y --no-progress
          Push-Location packaging\windows
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          Pop-Location
          Move-Item packaging\windows\zyrisd-setup-x86_64.exe dist\ -Force
          Remove-Item packaging\windows\zyrisd.exe -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  release:
    name: create release
    needs: [linux-x86_64, linux-aarch64, windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: assemble assets (install scripts + checksums)
        run: |
          set -e
          cp install.sh install.ps1 dist/
          # Write the sums outside dist, then move them in. Redirecting straight into dist/
          # truncates the file before the glob runs, so SHA256SUMS lists itself with the hash
          # of an empty file — a line that can never verify.
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/
          ls -la dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
            TAG="v${VERSION}"
          fi
          # In case the same tag is re-run: delete the existing release (and tag), then recreate.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "zyrisd $TAG" \
            --notes "Automated build release. See the README for install instructions."
