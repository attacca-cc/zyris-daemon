[workspace]
resolver = "3"
members = ["crates/zyrisd", "crates/zyrisd-node", "crates/zyrisd-display-proto"]
# display/ is not a member. In the same workspace, one `cargo build --workspace` would unify
# zyris-capkit's desktop feature and link X11/Wayland into the parent binary too.
# Feature unification is per cargo invocation, across every member in it — not per crate.
exclude = ["display"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Not origin/main: this is the head of zyris PR #24, which carries the five defects the live
# run on a second machine turned up — the rustls provider panic, the regenerated peer identity,
# the missing peers:write scope, the write-once rendezvous client, and the dial that let a
# peer's own unreachable addresses shut discovery out. Move this to main's sha once that merges.
# scripts/check-zyris-pin.sh guards that both workspaces agree.
zyris = { git = "https://github.com/attacca-cc/zyris", rev = "ce6026ed4d7596609a4da85a4b4a051eb2ed9e86", features = ["enroll"] }
zyris-caps = { git = "https://github.com/attacca-cc/zyris", rev = "ce6026ed4d7596609a4da85a4b4a051eb2ed9e86" }
zyris-capkit = { git = "https://github.com/attacca-cc/zyris", rev = "ce6026ed4d7596609a4da85a4b4a051eb2ed9e86", features = ["transfer-send", "transfer-listen"] }
# Both are transfer's doing: the rendezvous client the send side asks where a peer is, and the
# transport it dials over. Declared here with the others so the pin covers them too — a member
# crate declaring one itself links zyris twice and earns "same type, different types".
zyris-attacca = { git = "https://github.com/attacca-cc/zyris", rev = "ce6026ed4d7596609a4da85a4b4a051eb2ed9e86" }
zyris-p2p = { git = "https://github.com/attacca-cc/zyris", rev = "ce6026ed4d7596609a4da85a4b4a051eb2ed9e86" }
zyrisd-node = { path = "crates/zyrisd-node" }
zyrisd-display-proto = { path = "crates/zyrisd-display-proto" }

anyhow = "1.0"
bytes = "1.12"
libc = "0.2"
# Only for `main` to settle which rustls crypto provider this process uses — see the comment at
# the call site. `ring` is named explicitly because that is the one being chosen; leaving it to
# default features would put the choice back where it already failed.
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "io-util", "sync", "time"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
