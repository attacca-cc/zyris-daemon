[workspace]
resolver = "3"
members = ["crates/zyrisd", "crates/zyrisd-node", "crates/zyrisd-display-proto"]
# display/ is not a member. In the same workspace, one `cargo build --workspace` would unify
# zyris-capkit's desktop feature and link X11/Wayland into the parent binary too.
# Feature unification is per cargo invocation, across every member in it — not per crate.
exclude = ["display"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# rev is origin/main HEAD (2026-08-16). scripts/check-zyris-pin.sh guards it.
zyris = { git = "https://github.com/attacca-cc/zyris", rev = "cacaf0252f61bf1aa99e9491cde2a2a38dcb1102", features = ["enroll"] }
zyris-caps = { git = "https://github.com/attacca-cc/zyris", rev = "cacaf0252f61bf1aa99e9491cde2a2a38dcb1102" }
zyris-capkit = { git = "https://github.com/attacca-cc/zyris", rev = "cacaf0252f61bf1aa99e9491cde2a2a38dcb1102", features = ["transfer-send", "transfer-listen"] }
# Both are transfer's doing: the rendezvous client the send side asks where a peer is, and the
# transport it dials over. Declared here with the others so the pin covers them too — a member
# crate declaring one itself links zyris twice and earns "same type, different types".
zyris-attacca = { git = "https://github.com/attacca-cc/zyris", rev = "cacaf0252f61bf1aa99e9491cde2a2a38dcb1102" }
zyris-p2p = { git = "https://github.com/attacca-cc/zyris", rev = "cacaf0252f61bf1aa99e9491cde2a2a38dcb1102" }
zyrisd-node = { path = "crates/zyrisd-node" }
zyrisd-display-proto = { path = "crates/zyrisd-display-proto" }

anyhow = "1.0"
bytes = "1.12"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "io-util", "sync", "time"] }
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
