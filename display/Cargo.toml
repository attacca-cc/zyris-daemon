[workspace]
# Empty on purpose. This manifest becomes its own workspace root, fully detached from the
# feature unification above. That makes it impossible for a single `cargo build --workspace`
# to leak zyris-capkit's desktop feature into the parent binary.

[package]
name = "zyrisd-display"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "zyrisd desktop helper. The only binary that links graphics libraries"

[[bin]]
name = "zyrisd-display"
path = "src/main.rs"

[dependencies]
zyrisd-display-proto = { path = "../crates/zyrisd-display-proto" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zyris = { git = "https://github.com/attacca-cc/zyris", rev = "509bb5f8beae40f572ff7374e29bb80a50b26be7" }
zyris-caps = { git = "https://github.com/attacca-cc/zyris", rev = "509bb5f8beae40f572ff7374e29bb80a50b26be7" }
zyris-capkit = { git = "https://github.com/attacca-cc/zyris", rev = "509bb5f8beae40f572ff7374e29bb80a50b26be7", features = ["desktop", "input-wayland", "input-libei"] }

# Uses the local ~/zyris worktree — bare super key, and the GNOME move_to fallback fix. Once
# those land on origin/main and the pin moves up, this section can go.
[patch."https://github.com/attacca-cc/zyris"]
zyris = { path = "/home/ruma/zyris/crates/zyris" }
zyris-caps = { path = "/home/ruma/zyris/crates/zyris-caps" }
zyris-capkit = { path = "/home/ruma/zyris/crates/zyris-capkit" }

# No enigo patch here on purpose. The libei Shift fix lives in ridanit-ruma/enigo-zyris, which
# zyris-capkit depends on by rev, so this workspace gets it by building capkit — on any machine,
# not just the one that happened to hold the checkout.

# See the same block in the zyris workspace: full debug info is what fills the disk on this
# machine, and `line-tables-only` still gives every backtrace frame its file and line.
[profile.dev]
debug = "line-tables-only"
